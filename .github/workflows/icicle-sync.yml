name: Sync upstream

on:
  schedule:
    - cron: '25 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: icicle-upstream-sync

jobs:
  sync:
    if: github.repository == 'ICICLE-ai/proofofthought' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Merge upstream main
        env:
          UPSTREAM_URL: https://github.com/DebarghaG/proofofthought.git
          SYNC_KEY: ${{ secrets.ICICLE_SYNC_SSH_KEY }}
        run: bash .github/scripts/sync-upstream.sh
